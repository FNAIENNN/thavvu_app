publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  shared_preferences: ^2.2.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  go_router: ^12.1.3
  google_fonts: ^6.1.0
